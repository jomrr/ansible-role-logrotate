[project]
name = "logrotate"
version = "0.0.0"
description = "Rotate and compress application and web server logs on systemd hosts."
requires-python = ">=3.13"
authors = [
  { name = "Jonas Mauer" },
]
license = "MIT"
keywords = ["logging", "logrotate", "systemd", "linux"]

[project.urls]
Repository = "https://github.com/jomrr/ansible-role-logrotate"

[tool.uv]
package = false

[dependency-groups]
ansible = [
  "ansible-core==2.22.*",
  "ansible-lint==26.*",
]

podman = [
  "molecule==26.*",
  "molecule-plugins[podman]==25.*",
]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
branch = "main"
commit_message = "build(release): version {version}"
major_on_zero = true
upload_to_pypi = false
upload_to_vcs_release = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]
