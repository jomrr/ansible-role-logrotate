---
# role: logrotate
# file: tasks/main.yml

- name: Gather facts and load platform settings
  ansible.builtin.import_tasks: set_vars.yml

- name: Check the rotation policy
  ansible.builtin.import_tasks: assert.yml

- name: Install the rotation package
  ansible.builtin.import_tasks: install.yml

- name: Configure system-wide rotation defaults
  become: true
  become_user: root
  ansible.builtin.template:
    src: policy.j2
    dest: /etc/logrotate.d/00-ansible-policy
    owner: root
    group: root
    mode: '0644'
    backup: "{{ __logrotate_dropin_backup }}"
    validate: "{{ __logrotate_validate_config }}"

- name: Withdraw named application rules
  become: true
  become_user: root
  ansible.builtin.file:
    path: "/etc/logrotate.d/{{ __logrotate_rule.name }}"
    state: absent
  loop: "{{ logrotate_rules }}"
  loop_control:
    loop_var: __logrotate_rule
    label: "{{ __logrotate_rule.name }}"
  when: __logrotate_rule.state | default('present') == 'absent'

- name: Configure named application rules
  become: true
  become_user: root
  ansible.builtin.template:
    src: rule.j2
    dest: "/etc/logrotate.d/{{ __logrotate_rule.name }}"
    owner: root
    group: root
    mode: '0644'
    backup: "{{ __logrotate_dropin_backup }}"
    validate: "{{ __logrotate_validate_rule }}"
  loop: "{{ logrotate_rules }}"
  loop_control:
    loop_var: __logrotate_rule
    label: "{{ __logrotate_rule.name }}"
  when: __logrotate_rule.state | default('present') == 'present'

- name: Apply the web log policy to selected installed servers
  become: true
  become_user: root
  ansible.builtin.template:
    src: web.j2
    dest: "/etc/logrotate.d/{{ __logrotate_web_profile.package }}"
    owner: root
    group: root
    mode: '0644'
    backup: "{{ __logrotate_dropin_backup }}"
    validate: "{{ __logrotate_validate_config }}"
  loop: "{{ logrotate_web_servers }}"
  loop_control:
    loop_var: __logrotate_web
    label: "{{ __logrotate_web_profile.package }}"
  when: __logrotate_web_profile.package in ansible_facts.packages

- name: Validate the installed logrotate configuration
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [/usr/sbin/logrotate, --debug, /etc/logrotate.conf]
  register: __logrotate_config_check
  failed_when: __logrotate_config_check.rc != 0
  changed_when: false
  check_mode: false
  when: ansible_facts.os_family != 'Suse'

- name: Validate the installed openSUSE configuration and effective drop-ins
  become: true
  become_user: root
  ansible.builtin.command:
    argv: [/usr/bin/bash, -s]
    stdin: "{{ lookup('ansible.builtin.file', 'check-suse-config.sh') }}"
  register: __logrotate_suse_config_check
  failed_when: __logrotate_suse_config_check.rc != 0
  changed_when: false
  check_mode: false
  when: ansible_facts.os_family == 'Suse'

- name: Create the timer override directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure the check interval
  become: true
  become_user: root
  ansible.builtin.template:
    src: timer.conf.j2
    dest: /etc/systemd/system/logrotate.timer.d/50-schedule.conf
    owner: root
    group: root
    mode: '0644'
    backup: "{{ logrotate_backup }}"
  notify: restart logrotate timer

- name: Load timer changes before enabling the schedule
  ansible.builtin.meta: flush_handlers

- name: Enable and start the rotation timer
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: logrotate.timer
    enabled: true
    state: started
