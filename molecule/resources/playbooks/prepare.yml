---
# role: logrotate
# file: molecule/resources/playbooks/prepare.yml

- name: LOGROTATE | Prepare web server fixtures
  hosts: all
  gather_facts: true
  tasks:
    - name: LOGROTATE | Install Debian web packages without starting competing listeners
      become: true
      become_user: root
      ansible.builtin.apt:
        name: [nginx, apache2]
        update_cache: true
        policy_rc_d: 101
      when: ansible_facts.os_family == 'Debian'

    - name: LOGROTATE | Install RPM web packages
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - nginx
          - "{{ 'httpd' if ansible_facts.os_family == 'RedHat' else 'apache2' }}"
        state: present
      when: ansible_facts.os_family != 'Debian'

    - name: LOGROTATE | Supply site defaults that conflict with the managed web and application policies
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/logrotate.d/01-molecule-site-policy
        mode: '0644'
        content: |
          weekly
          rotate 4
          maxage 2
          dateext
          dateformat -%Y%m%d
          nocompress
          nodelaycompress
          ifempty

    - name: LOGROTATE | Start the packaged Apache service to exercise graceful reload
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "{{ 'httpd' if ansible_facts.os_family == 'RedHat' else 'apache2' }}.service"
        state: started

    - name: LOGROTATE | Configure an isolated nginx access log
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        mode: '0644'
        content: |
          events {}
          http {
              access_log /var/log/nginx/molecule-access.log;
              server { listen 127.0.0.1:8181; return 204; }
          }

    - name: LOGROTATE | Start the nginx writer
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: nginx.service
        state: restarted
