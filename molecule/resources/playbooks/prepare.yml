---
# role: logrotate
# file: molecule/resources/playbooks/prepare.yml

- name: Prepare web server fixtures
  hosts: all
  gather_facts: false
  tasks:
    - name: Load the role's platform settings
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: set_vars
        public: true

    - name: Install Debian web packages without starting competing listeners
      become: true
      become_user: root
      ansible.builtin.apt:
        name: [nginx, apache2]
        update_cache: true
        policy_rc_d: 101
      when: ansible_facts.os_family == 'Debian'

    - name: Install RPM web packages
      become: true
      become_user: root
      ansible.builtin.package:
        name:
          - nginx
          - "{{ __logrotate_apache_package }}"
        state: present
      when: ansible_facts.os_family != 'Debian'

    - name: Supply site defaults that conflict with the managed web and application policies
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/logrotate.d/01-molecule-site-policy
        mode: '0644'
        content: |
          weekly
          rotate 4
          maxage 2
          dateext
          dateformat -%Y%m%d
          nocompress
          nodelaycompress
          ifempty

    - name: Start the packaged Apache service to exercise graceful reload
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "{{ __logrotate_apache_package }}.service"
        state: started

    - name: Configure an isolated nginx access log
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        mode: '0644'
        content: |
          events {}
          http {
              access_log /var/log/nginx/molecule-access.log;
              server { listen 127.0.0.1:8181; return 204; }
          }

    - name: Start the nginx writer
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: nginx.service
        state: restarted
